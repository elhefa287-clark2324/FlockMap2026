L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

map.addLayer(cl);
var G=0.005,grid={};P.forEach(function(p,i){var k=Math.floor(p.lat/G)+','+Math.floor(p.lon/G);(grid[k]=grid[k]||[]).push(i);});
function nearby(la,lo){var out=[],a=Math.floor(la/G),b=Math.floor(lo/G);for(var x=a-1;x<=a+1;x++)for(var y=b-1;y<=b+1;y++){var c=grid[x+','+y];if(c)out=out.concat(c);}return out;}
var me=null,muted=false,alerted={},st=document.getElementById('st');
function say(t){if(muted||!window.speechSynthesis)return;speechSynthesis.speak(new SpeechSynthesisUtterance(t));}
function dist(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function onpos(pos){var la=pos.coords.latitude,lo=pos.coords.longitude;
 if(!me){me=L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#06f',fillOpacity:1}).addTo(map);map.setView([la,lo],15);}else me.setLatLng([la,lo]);
 var near=0,nb=nearby(la,lo),set={};nb.forEach(function(i){set[i]=1});for(var k in alerted)if(!set[k])delete alerted[k];nb.forEach(function(i){var p=P[i],d=dist(la,lo,p.lat,p.lon);

  else if(d>300)alerted[i]=0;});
